{% extends "base.html" %}

{% block title %}Login | Smart AgroAssist{% endblock %}

{% block content %}

<section class="auth-section">

    <div class="auth-container">

        <!-- LOGIN FORM -->
        <form method="POST"
              action="{% url 'login' %}"
              id="login-form"
              class="{% if show_register %}hidden{% endif %}">

            {% csrf_token %}

            <h2>Login</h2>

            {% if error %}
                <p style="color:red;">{{ error }}</p>
            {% endif %}

            <label>Username</label>
            <input type="text"
                   name="username"
                   placeholder="Enter username"
                   required>

            <label>Password</label>
            <input type="password"
                   name="password"
                   placeholder="Enter password"
                   required>

            <button type="submit" class="btn-primary">
                Login
            </button>

            <p>
                Don't have an account?
                <a href="#"
                   onclick="showRegisterForm()">
                   Register here
                </a>
            </p>

        </form>



        <!-- REGISTER FORM -->
        <form method="POST"
              action="{% url 'register' %}"
              id="register-form"
              class="{% if not show_register %}hidden{% endif %}">

            {% csrf_token %}

            <h2>Create Account</h2>

            <label>Username</label>
            <input type="text"
                   name="username"
                   placeholder="Choose username"
                   required>

            <label>Password</label>
            <input type="password"
                   name="password"
                   placeholder="Create password"
                   required>

            <button type="submit"
                    class="btn-primary">

                Register

            </button>

            <p>
                Already have an account?
                <a href="#"
                   onclick="showLoginForm()">
                   Login here
                </a>
            </p>

        </form>

    </div>

</section>



<!-- SIMPLE TOGGLE SCRIPT -->
<script>

function showRegisterForm() {

    document.getElementById("login-form")
            .classList.add("hidden");

    document.getElementById("register-form")
            .classList.remove("hidden");
}

function showLoginForm() {

    document.getElementById("register-form")
            .classList.add("hidden");

    document.getElementById("login-form")
            .classList.remove("hidden");
}

</script>

{% endblock %}
